<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Hero image placeholder</title>
  <desc id="desc">Replace this file with the new client's hero image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#726554"/>
      <stop offset="1" stop-color="#252d35"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1250" cy="280" r="330" fill="#fff" opacity=".08"/>
  <circle cx="280" cy="850" r="440" fill="#c6a981" opacity=".14"/>
  <text x="800" y="500" text-anchor="middle" fill="#fff" opacity=".7" font-family="Arial, sans-serif" font-size="34" letter-spacing="8">REPLACE HERO IMAGE</text>
</svg>
